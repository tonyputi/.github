name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      github_app_id:
        description: 'GitHub App ID'
        required: true
        type: string
    secrets:
      github_app_private_key:
        description: 'GitHub App private key (PEM)'
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  enable-auto-merge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    steps:
      - name: Find the current Dependabot PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          number=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f state=open -f "head=${GH_REPO%/*}:$HEAD_BRANCH" \
            | jq -r --arg repo "$GH_REPO" --arg sha "$HEAD_SHA" --arg base "$DEFAULT_BRANCH" '
              .[] | select(
                .user.login == "dependabot[bot]" and .user.id == 49699333 and
                .state == "open" and .draft == false and
                .head.repo.full_name == $repo and .base.repo.full_name == $repo and
                .base.ref == $base and .head.sha == $sha
              ) | .number')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create a repository-scoped App token
        if: steps.pr.outputs.number != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.github_app_id }}
          private-key: ${{ secrets.github_app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable native squash auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash --match-head-commit "$HEAD_SHA"
