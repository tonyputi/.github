name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-dependabot-branch-update:
    name: Test Dependabot Branch Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run metadata-only workflow regression tests
        run: node --test tests/*.test.cjs

  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh

  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint workflow files
        uses: ./actions/lint/yaml
        with:
          path: '.github/workflows'
